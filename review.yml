  - date: '2026-08-30'
    rating: 3
    summary: >-
      University-pipeline re-profile with operator attribution settled before anything was saved.
      Three institution-operated machine surfaces were confirmed live on the university's own
      nottingham.ac.uk hosts: a self-hosted DSpace 8.2 / DSpace-CRIS (cris-2024.02.04) repository
      at repository.nottingham.ac.uk exposing a keyless HAL+JSON REST API at /server/api; its
      OAI-PMH 2.0 provider at /server/oai/request advertising eight metadata formats including
      RIOXX v3.0, uketd_dc and an OpenAIRE CERIF 1.1 base URL; and a Shibboleth SAML 2.0 identity
      provider (entityID https://idp.nottingham.ac.uk/shibboleth) published in the UK Access
      Management Federation metadata aggregate, with sibling IdPs for the Malaysia and Ningbo
      campuses. Five education-regime domain standards are evidenced from public endpoints —
      oai-pmh, shibboleth, saml, orcid (DSpace-CRIS ORCID client APP-NETTHMK3BB3SW6KV exposed at
      /server/api/config/properties) and datacite (DataCite provider frvi / client bl.notts, prefix
      10.17639, 1,609 DOIs resolving into the repository). Crossref returns no member record and is
      recorded as false. Two vendor platforms are recorded as TENANT relationships and their
      contracts were not saved here: Worktribe (nottingham-repository.worktribe.com OAI-PMH,
      adminEmail discovery-access-systems@nottingham.ac.uk) and Ex Libris Alma/Primo VE (NUsearch,
      registered as a SAML SP for all three campuses). The previously catalogued legacy EPrints /
      eTheses OAI-PMH endpoints are gone: eprints. and etheses.nottingham.ac.uk now 301 into
      repository.nottingham.ac.uk, so that entry was removed rather than left as a dead claim. The
      prior DeveloperPortal pointer at /dts/ was also removed — DTS is an IT-services page, not a
      developer portal, and the university operates none. No OpenAPI was generated: the DSpace and
      OAI-PMH contracts are product contracts every deployment shares and belong in the vendor's
      own repo. One notable asymmetry: the repository's human Angular UI is behind an AWS WAF
      human-verification challenge (405) while its machine API answers openly.

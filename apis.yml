apis:
  - aid: university-of-nottingham:repository-rest
    name: Repository@Nottingham DSpace REST API
    x-operator: institution
    description: >-
      Keyless, read-only HAL+JSON REST API of the university's self-hosted
      DSpace 8.2 / DSpace-CRIS (cris-2024.02.04) institutional repository, served
      from the university's own domain at repository.nottingham.ac.uk/server/api.
      The root document advertises the full DSpace link set — core/communities,
      core/collections, core/items, core/bitstreams, discover/search/objects,
      discover/browses, config/properties, statistics and authn. Verified live on
      2026-08-30: GET /server/api returns 200 application/hal+json naming
      "University of Nottingham Repository"; GET /server/api/core/communities and
      GET /server/api/discover/search/objects both return 200 with real records.
      The contract itself is the DSpace product's, shared by every DSpace
      deployment — so no OpenAPI is saved under this institution — but the
      deployment, the host and the data are Nottingham's. The Angular human UI on
      the same host is behind an AWS WAF human-verification challenge (405) while
      this API path is open.
    humanURL: https://www.nottingham.ac.uk/library/research/open-access/
    baseURL: https://repository.nottingham.ac.uk/server/api
    tags: [ Research Repository, DSpace, REST, Open Access, Metadata ]
    properties:
      - type: APIReference
        url: https://repository.nottingham.ac.uk/server/api
  - aid: university-of-nottingham:repository-dspace-oai
    name: Repository@Nottingham OAI-PMH (DSpace, institution-hosted)
    x-operator: institution
    description: >-
      OAI-PMH 2.0 metadata-harvesting provider of the institution-hosted DSpace
      repository. Verified live 2026-08-30 — verb=Identify returns 200 text/xml
      with repositoryName "University of Nottingham Repository",
      repositoryIdentifier repository.nottingham.ac.uk and an OpenAIRE CERIF 1.1
      Compatibility block naming a second base URL at /server/oai/openairecris.
      verb=ListMetadataFormats returns eight prefixes including RIOXX v3.0 and
      uketd_dc (the UK EThOS thesis profile); verb=ListSets enumerates community
      and collection sets covering Nottingham eTheses, eDissertations (UK and
      UNM) and the CRIS. This is the endpoint that succeeded the retired
      EPrints OAI-PMH interfaces at eprints./etheses.nottingham.ac.uk, which now
      301 into this host.
    humanURL: https://www.nottingham.ac.uk/library/research/
    baseURL: https://repository.nottingham.ac.uk/server/oai/request
    tags: [ Research Repository, OAI-PMH, DSpace, RIOXX, Open Access ]
    properties:
      - type: Documentation
        url: https://www.openarchives.org/OAI/openarchivesprotocol.html
      - type: Conformance
        url: conformance/university-of-nottingham-conformance.yml
  - aid: university-of-nottingham:identity-federation
    name: University of Nottingham Shibboleth Identity Provider (UK Access Management Federation)
    x-operator: institution
    description: >-
      Institution-operated Shibboleth SAML 2.0 identity provider, registered and
      published as machine-readable metadata in the UK Access Management
      Federation aggregate. EntityID https://idp.nottingham.ac.uk/shibboleth,
      DisplayName "University of Nottingham", with SSO endpoints under
      /shibboleth-idp/profile/SAML2/{POST,POST-SimpleSign,Redirect}/SSO and
      SOAP artifact resolution on port 8443. Two further campus IdPs are
      registered — https://idp.nottingham.edu.my/idp/shibboleth (Malaysia) and
      https://idp.nottingham.edu.cn/idp/shibboleth (Ningbo, China) — along with
      institution-operated SAML service providers for the DSpace repository
      (rdmc.nottingham.ac.uk), the Survey of English Place-Names
      (epns.nottingham.ac.uk, simpleSAMLphp) and International Human Rights
      Reports (ihrr.nottingham.ac.uk). Non-production entities (testidp., devidp.,
      rdmc-test.) also appear in the aggregate and are excluded as placeholders.
      This is a real, machine-readable, institution-run surface and it is the one
      class of university API that is almost never catalogued.
    humanURL: https://www.ukfederation.org.uk/
    baseURL: https://idp.nottingham.ac.uk/shibboleth-idp/profile/SAML2/Redirect/SSO
    tags: [ Identity Federation, SAML, Shibboleth, Single Sign-On, Authentication ]
    properties:
      - type: Documentation
        url: https://www.ukfederation.org.uk/
      - type: Conformance
        url: conformance/university-of-nottingham-conformance.yml
  - aid: university-of-nottingham:repository-oai
    name: Repository@Nottingham OAI-PMH (Worktribe tenant)
    x-operator: tenant
    description: >-
      OAI-PMH 2.0 interface for the Worktribe-hosted Repository@Nottingham
      research-outputs showcase. Confirmed live 2026-08-30 — verb=Identify
      returns 200 with repositoryName "Repository@Nottingham", adminEmail
      discovery-access-systems@nottingham.ac.uk and sample identifier
      oai:nottingham-repository.worktribe.com:702877; verb=ListMetadataFormats
      returns oai_dc, rioxx and uketd_dc. nottingham-repository.worktribe.com is
      an institution-specific subdomain on Worktribe's platform: the metadata and
      the research outputs are Nottingham's, the software and the contract are
      Worktribe's. Recorded here as a tenant relationship — a real institutional
      fact — rather than credited to Nottingham as its own engineering. No
      Worktribe contract is saved under this institution.
    humanURL: https://nottingham-repository.worktribe.com/
    baseURL: https://nottingham-repository.worktribe.com/oaiprovider
    tags: [ Research Repository, OAI-PMH, Worktribe, Tenant, Open Access ]
    properties:
      - type: Documentation
        url: https://www.openarchives.org/OAI/openarchivesprotocol.html
  - aid: university-of-nottingham:library-discovery
    name: NUsearch library discovery (Ex Libris Alma / Primo VE tenant)
    x-operator: tenant
    description: >-
      Library discovery and resource management on Ex Libris Alma and Primo VE,
      operated as a Nottingham tenant across all three campuses. Registered in
      the UK Access Management Federation as SAML service providers
      https://nusearch.nottingham.ac.uk/mng/login ("University of Nottingham (UK
      campus) – Primo"), plus nottingham-uk.alma.exlibrisgroup.com,
      nottingham-my.* and nottingham-cn.*.cn equivalents for the Malaysia and
      China campuses. nusearch.nottingham.ac.uk/ resolves 200 to
      /discovery/search?vid=44NOTTS_UNUK:44NOTUK. The discovery and Alma APIs
      belong to Ex Libris and are not saved here; only the tenant relationship is
      recorded.
    humanURL: https://nusearch.nottingham.ac.uk/
    tags: [ Library, Discovery, Ex Libris, Primo, Alma, Tenant ]

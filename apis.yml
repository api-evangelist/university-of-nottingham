  detail: >-
    Three institution-operated machine surfaces were found and verified live on
    2026-08-30 — a DSpace 8.2 REST API and an OAI-PMH 2.0 provider on
    repository.nottingham.ac.uk, and a Shibboleth SAML 2.0 identity provider
    published in the UK Access Management Federation metadata aggregate — plus
    five education-regime domain standards evidenced from public endpoints
    (oai-pmh, shibboleth, saml, orcid, datacite). Two vendor platforms are
    recorded as tenant relationships rather than as Nottingham contracts:
    Worktribe (Repository@Nottingham) and Ex Libris Alma/Primo VE (NUsearch). No
    OpenAPI, no developer portal and no self-service key issuance exist anywhere
    on the institution's public surface, and no contract has been generated to
    stand in for one: the DSpace and OAI-PMH contracts are product contracts
    shared by every deployment of that software and belong in the vendor's own
    repo, not here. The legacy EPrints OAI-PMH endpoints previously catalogued
    (eprints. and etheses.nottingham.ac.uk /perl/oai2) now 301 into
    repository.nottingham.ac.uk and are removed. Student records, timetabling,
    module enrolment and the VLE sit behind SSO and were not probeable.

description: >-
  The University of Nottingham is a public research university in Nottingham,
  United Kingdom — a founding Russell Group member with campuses in the UK,
  Malaysia (UNM) and Ningbo, China (UNNC). It runs no public developer portal
  and publishes no OpenAPI, and this profile does not pretend otherwise. What it
  does operate, on its own nottingham.ac.uk hosts, is three genuinely
  institution-run machine surfaces: a self-hosted DSpace 8.2 / DSpace-CRIS
  repository at repository.nottingham.ac.uk exposing a keyless read-only
  HAL+JSON REST API and an OAI-PMH 2.0 provider (oai_dc, qdc, mets, rdf, dim,
  etdms, uketd_dc and RIOXX v3.0, plus an OpenAIRE CERIF 1.1 base URL), and a
  Shibboleth SAML 2.0 identity provider registered in the UK Access Management
  Federation for all three campuses. Its ORCID member integration and its
  DataCite prefix 10.17639 (1,609 DOIs resolving to its own repository) are
  verifiable from public endpoints. Alongside these it is a tenant on two vendor
  platforms — a Worktribe-hosted Repository@Nottingham OAI-PMH interface and Ex
  Libris Alma/Primo VE library discovery (NUsearch) — whose contracts belong to
  those vendors, not to Nottingham. Student records, timetabling, module
  enrolment and the VLE are behind SSO and are not publicly documented APIs.
  Notably, the repository's human Angular UI is behind an AWS WAF
  human-verification challenge while its machine API is entirely open.
